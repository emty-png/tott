name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu runners ship an SDK already; just top up licenses + the
      # exact platform/build-tools (setup-android@v3 tries to install the
      # long-removed `tools` package and fails).
      - name: Install SDK packages
        run: |
          SDK="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null
          "$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      # Release is signed with the debug key (see app/build.gradle.kts),
      # so both APKs install anywhere with no secrets configured.
      - name: Build debug + release
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: tott-apks
          path: app/build/outputs/apk/**/*.apk
