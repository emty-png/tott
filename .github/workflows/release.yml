name: release

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so the changelog can list
          # every commit since the previous tag.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu runners ship an SDK already; just top up licenses + the
      # exact platform/build-tools (setup-android@v3 tries to install the
      # long-removed `tools` package and fails).
      - name: Install SDK packages
        run: |
          SDK="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null
          "$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
      # NOTE: the APK is signed with the debug key, which is fine for
      # sideloading but not for the Play Store. For a store release, add a
      # real keystore as secrets (ANDROID_KEYSTORE_BASE64,
      # ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD),
      # decode it to app/keystore.jks in a step above, and point the release
      # signingConfig at it instead of `signingConfigs.getByName("debug")`.
      - name: Build release
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk tott-${{ github.ref_name }}.apk
      # Group every commit since the previous tag by its
      # conventional-commit prefix (feat/fix/perf/chore/…).
      - name: Build categorized changelog
        env:
          CUR_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import os, subprocess

          cur = os.environ["CUR_TAG"]
          repo = os.environ.get("REPO", "")

          tags = subprocess.run(
              ["git", "tag", "--sort=-v:refname"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          prev = next((t for t in tags if t != cur), "")
          rng = "HEAD" if not prev else f"{prev}..HEAD"
          print(f"Changelog range: {rng or '(empty)'}")

          log = subprocess.run(
              ["git", "log", rng, "--pretty=format:%s%x1f%h", "--reverse"] if rng else [],
              capture_output=True, text=True, check=True,
          ).stdout.strip().splitlines() if rng else []

          sections = [
              ("feat", "✨ Features"),
              ("fix", "🐛 Fixes"),
              ("perf", "⚡ Performance"),
              ("chore", "🔧 Chores"),
          ]
          grouped = {k: [] for k, _ in sections}
          other = []
          for line in log:
              if not line.strip():
                  continue
              subject, _, sha = line.partition("\x1f")
              subject = subject.strip()
              low = subject.lower()
              hit = False
              for key, _ in sections:
                  if low.startswith(key + ":") or low.startswith(key + "("):
                      body = subject.split(":", 1)[1].strip() if ":" in subject else subject
                      grouped[key].append(f"- {body} (`{sha.strip()}`)")
                      hit = True
                      break
              if not hit:
                  other.append(f"- {subject} (`{sha.strip()}`)")

          lines = ["## What's Changed", ""]
          for key, title in sections:
              if grouped[key]:
                  lines += [f"### {title}", ""] + grouped[key] + [""]
          if other:
              lines += ["### 📦 Other", ""] + other + [""]
          if not log:
              lines += ["No commits in range.", ""]
          if prev and repo:
              lines += [f"**Full Changelog**: https://github.com/{repo}/compare/{prev}...{cur}", ""]
          with open("CHANGELOG.md", "w") as f:
              f.write("\n".join(lines))
          print("\n".join(lines))
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          files: tott-*.apk
          bodyFile: CHANGELOG.md
